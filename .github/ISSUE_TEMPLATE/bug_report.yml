name: Bug report
description: Report a reproducible Healthcare Lab problem using synthetic data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include patient data, credentials, private endpoints, or sensitive DICOM metadata.
  - type: dropdown
    id: area
    attributes:
      label: Workflow area
      options:
        - HL7 v2 / OIE
        - FHIR R4 / Medplum
        - GDT
        - DICOM / dcm4chee
        - Dashboard / deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "v1.2.0, edge, or commit SHA"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic identifiers and redact secrets.
      placeholder: |
        1. Start ...
        2. Create ...
        3. Send ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Include sanitized logs, ACK codes, HTTP status, or screenshots.
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I confirm this report contains no real patient data or credentials.
          required: true
