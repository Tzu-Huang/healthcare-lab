name: Feature request
description: Propose an interoperability workflow or operator-experience improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: Workflow area
      options:
        - HL7 v2 / OIE
        - FHIR R4 / Medplum
        - GDT
        - DICOM / dcm4chee
        - Dashboard / deployment
        - Documentation
        - Cross-protocol
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What testing or integration task is difficult today?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Proposed workflow
      description: Describe the actors, messages/resources, and expected outcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I may be able to help implement or verify this request.
